# A runnable sample over the stub family: six tasks sleeping five to ten
# seconds, two workers, so a full run takes about half a minute.
#
#   sima run example          # drive the run; Ctrl-C interrupts gracefully
#   sima status example       # from another terminal: the run's state
#
# Re-running after an interrupt resumes from the store and finalizes.
# The store lives under work/ (gitignored); delete it to start fresh.

[run]
root_seed = 11
format = "stub.v1"

[run.generator]
id = "stub.v1"
behaviors = [
    "sleep:5000",
    "sleep:6000",
    "sleep:7000",
    "sleep:8000",
    "sleep:9000",
    "sleep:10000",
]

[execution]
store = "./work/example-store"
workers = 2
max_attempts = 3
