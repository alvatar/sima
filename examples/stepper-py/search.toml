[run]
root_seed = 7
format = "example.stepper.v1"
segments = 3

[run.generator]
id = "example.stepper.candidates"
count = 2

[run.params]
steps = 5             # raise to ~300000000 for the tutorial's machine chapter

[config]
store = "./store"
max_attempts = 3
checkpoint_interval_ms = 2000   # save resumable state every 2s

# Uncomment to give the run a destination: `sima migrate` moves it onto the
# [host.*] entry this names. `sima run` ignores it and stays local.
# [orchestrator]
# migrate = "cloudbox"

[[orchestrator.device]]
select = "example:cpu"
workers = 2

[domain."example.stepper.v1"]
binary = "./stepper.py"
# A configured program is spawned with a cleared environment, so the names it
# needs are listed here and their values come from this shell: PATH for the
# shebang's interpreter lookup.
env = ["PATH"]
# The SDK this program is written against. The sima binary carries the package
# and puts it on the interpreter's path, so `import sima` resolves here and on
# any machine this run moves to, with nothing installed there.
sdk = "python"
# What travels when `sima migrate` moves this run onto another machine. One
# file is the program itself: the destination installs it as the entry point
# and needs no script. A directory would need one, naming it here as
# `install`, and that script leaves an executable $SIMA_INSTALL_DIR/program.
# That is also the answer for a program with third-party dependencies, which
# the payload carries and the script installs; see TUTORIAL.md.
payload = "./stepper.py"

# The rented destination `migrate` names: sima finds a vast offer under the
# constraints, boots its image on it, and the run lives there until recalled.
[host.cloudbox]
provider = "vast"     # rent from vast.ai; key comes from $VAST_API_KEY
disk_gb  = 32         # disk the instance is created with
root     = "~/sima-runs"   # where the migrated run lives on the machine
binary   = "sima"     # the sima binary there (on the image's PATH)

[host.cloudbox.constraints]
max_price_usd_hour = 0.20   # take no offer above this
verified_only      = true   # verified datacenters only

[budget]
max_spend_usd     = 2.0     # wind the run down if rental spend reaches this
max_wall_clock_ms = 0       # no ceiling; a rented destination is never sent one

# A machine you have instead, reached over ssh at the entry's own name.
# [host.gpubox]
# workers = 4                             # exclusive with a device table
# ssh     = "user@10.0.0.5"               # override the address
# root    = "~/sima-runs"                 # where a migrated run lives there
# binary  = "sima"                        # the sima binary there

