[workspace]
resolver = "3"
members = [
    "crates/sima",
    "crates/sima-contracts",
    "crates/sima-core",
    "crates/sima-domains",
    "crates/sima-integration",
    "crates/sima-model",
    "crates/sima-pipeline",
    "crates/sima-scheduler",
    "crates/sima-store",
    "crates/sima-worker",
    "crates/toolkits/sima-toolkit-wgsl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ash = "0.38"
blake3 = "1"
bytemuck = "1"
crossterm = "0.28"
libc = "0.2"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
tempfile = "3"
toml = "0.9"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
