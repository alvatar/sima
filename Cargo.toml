[workspace]
resolver = "3"
members = [
    "crates/sima",
    "crates/sima-contracts",
    "crates/sima-core",
    "crates/sima-model",
    "crates/sima-pipeline",
    "crates/sima-scheduler",
    "crates/sima-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
blake3 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.9"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
