name: ci

on:
  push:
  pull_request:

# Every job here runs on a GitHub-hosted runner, so a green run claims format,
# lint, and the tests that need only a CPU. The whole suite, the marked device
# tests included, runs on a real-device machine as the gate before merge.

jobs:
  # Format and lint touch no hardware, so they stay on a hosted runner.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The tests that need only a CPU, on every push. Green here claims exactly
  # the unmarked subset; the marked tests are the device gate's claim.
  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `on_device` in a test's path marks it as needing the device machine,
      # and this flag is the whole definition of the lane. The marker polices
      # itself: a device test that omits it runs here and dies on a missing
      # driver, so an omission turns this job red instead of passing unseen.
      #
      # `--no-fail-fast` keeps every target running, so a red lane names all of
      # its failures rather than the first failing binary's.
      - run: cargo test --workspace --no-fail-fast -- --skip on_device
