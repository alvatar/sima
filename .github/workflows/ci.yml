name: ci

on:
  push:
  pull_request:

jobs:
  # Format and lint touch no hardware, so they stay on a hosted runner.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The tests that need only a CPU, on every push. Green here means that
  # subset passed on a hosted runner, and says nothing about the tests this
  # lane skipped.
  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `on_device` in a test's path marks it as needing the device machine,
      # and this flag is the whole definition of the lane. The marker polices
      # itself: a device test that omits it runs here and dies on a missing
      # driver, so an omission turns this job red instead of passing unseen.
      - run: cargo test --workspace -- --skip on_device

  # The whole suite, the device tests included, on a machine with a Vulkan
  # device, an NVIDIA device, and libnvrtc on the loader path. Green here
  # means those tests ran on real hardware, which is the claim `test-cpu`
  # cannot make.
  #
  # This job stays queued until a self-hosted runner labelled `gpu` is
  # registered on such a machine. A queued `test` beside a green `test-cpu`
  # is a runner that is absent, not a test that was skipped.
  test:
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
        env:
          # Where NVRTC is staged on the runner, configured as a repository
          # variable so the location lives with the runner's registration. Only
          # the PTX-regeneration tests need it, to check a committed `.ptx`
          # still reproduces from its `.cu`; running the CUDA program itself
          # needs the driver's libcuda alone, which the runner supplies.
          LD_LIBRARY_PATH: ${{ vars.NVRTC_PATH }}
