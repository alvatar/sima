[package]
name = "sima-core"
version.workspace = true
edition.workspace = true

[features]
# Arms crashpoint(): the process SIGKILLs itself at env-armed points.
# Test-harness only; without it the calls compile to nothing.
crash-injection = ["dep:libc"]

[dependencies]
sima-core-derive = { path = "../sima-core-derive" }
blake3.workspace = true
libc = { workspace = true, optional = true }
toml.workspace = true

[lints]
workspace = true
