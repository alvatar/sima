[package]
name = "sima-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Arms crashpoint(): the process SIGKILLs itself at env-armed points.
# Test-harness only; without it the calls compile to nothing.
crash-injection = ["dep:libc"]

[dependencies]
blake3.workspace = true
libc = { workspace = true, optional = true }

[dev-dependencies]
# The process-group rule is stated against the system's own view of a process,
# so the tests ask it directly.
libc.workspace = true

[lints]
workspace = true
