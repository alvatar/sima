[package]
name = "sima"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Forwards crash-injection to the layers that plant points, so the crash
# harness can arm them in this binary.
crash-injection = [
    "sima-store/crash-injection",
    "sima-scheduler/crash-injection",
    "sima-pipeline/crash-injection",
    "sima-provider/crash-injection",
]

[dependencies]
sima-core = { path = "../sima-core" }
sima-pipeline = { path = "../sima-pipeline" }
sima-provider = { path = "../sima-provider" }
# The reconcile command resolves a backend from each ledger record's provider
# id, so the binary is where the backends are named.
sima-provider-vast = { path = "../providers/sima-provider-vast" }
sima-scheduler = { path = "../sima-scheduler" }
sima-store = { path = "../sima-store" }
crossterm.workspace = true
ratatui.workspace = true
signal-hook.workspace = true

[dev-dependencies]
sima-model = { path = "../sima-model" }
# The acceptance suites derive a search's chains the way the scheduler's chain
# source does, to join each chain to the devices its work ran on. A test-only
# edge: the binary itself reaches domains through the pipeline.
sima-domains = { path = "../sima-domains" }
libc.workspace = true
tempfile.workspace = true

# The crash harness runs only with the injection points compiled in.
[[test]]
name = "crash"
required-features = ["crash-injection"]

[lints]
workspace = true
