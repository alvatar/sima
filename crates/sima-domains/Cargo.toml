[package]
name = "sima-domains"
version.workspace = true
edition.workspace = true

[features]
# Forwards sima-core's crash-injection so the point planted in the stub
# executor can be armed by a test harness.
crash-injection = ["sima-core/crash-injection"]

[dependencies]
sima-core = { path = "../sima-core" }
sima-model = { path = "../sima-model" }
sima-contracts = { path = "../sima-contracts" }
sima-toolkit-cuda = { path = "../toolkits/sima-toolkit-cuda" }
sima-toolkit-wgsl = { path = "../toolkits/sima-toolkit-wgsl" }
bytemuck.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
sima-store = { path = "../sima-store" }
tempfile.workspace = true

[lints]
workspace = true
