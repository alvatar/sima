[package]
name = "sima-worker"
version.workspace = true
edition.workspace = true

[features]
# Forwards crash-injection to the domains layer so executor-side points can
# be armed inside the worker process by a test harness.
crash-injection = ["sima-domains/crash-injection"]

[dev-dependencies]
sima-trace = { path = "../sima-trace" }
# The domain-service tests compare the answers that cross the pipe against the
# same translations reached by direct call, which take a parsed table.
toml.workspace = true

[dependencies]
sima-core = { path = "../sima-core" }
sima-model = { path = "../sima-model" }
sima-contracts = { path = "../sima-contracts" }
sima-domains = { path = "../sima-domains" }
serde_json.workspace = true
sima-transport = { path = "../sima-transport" }
libc.workspace = true

[lints]
workspace = true
