[package]
name = "sima-store"
version.workspace = true
edition.workspace = true

[features]
# Forwards sima-core's crash-injection so the points planted in the write
# paths here can be armed by a test harness.
crash-injection = ["sima-core/crash-injection"]

[dependencies]
sima-core = { path = "../sima-core" }
sima-model = { path = "../sima-model" }
sima-trace = { path = "../sima-trace" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
