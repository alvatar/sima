[package]
name = "sima-pipeline"
version.workspace = true
edition.workspace = true

[features]
# Forwards crash-injection to the domains layer so the stub's planted point
# can be armed by a test harness driving the pipeline.
crash-injection = ["sima-domains/crash-injection"]

[dependencies]
sima-core = { path = "../sima-core" }
sima-model = { path = "../sima-model" }
sima-domains = { path = "../sima-domains" }
sima-scheduler = { path = "../sima-scheduler" }
sima-store = { path = "../sima-store" }
sima-transport = { path = "../sima-transport" }
serde.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
